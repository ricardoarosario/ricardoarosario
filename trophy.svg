name: Generate Minimal Trophy

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight
  workflow_dispatch:     # Allows manual trigger

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate trophy card
        uses: soulteary/profile-trophy-action@v1.0.0
        with:
          # Custom choices: Displays ONLY Commits in a beautiful Dark Theme layout
          options: 'username=ricardoarosario&theme=onedark&title=Commits&column=1&row=1'
          path: trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit trophy card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trophy.svg
          git commit -m "Update minimal trophy" || exit 0
          git push
